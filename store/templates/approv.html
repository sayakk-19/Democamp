{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Store</title>
    {% include 'store/includes/theme_head.html' %}
</head>
    <body>
<nav class="store-page-toolbar" aria-label="Account and home" hidden>
  <a class="store-home-link" href="{% url 'store_home' %}">Home</a>
  {% load store_ui %}{% store_account_menu %}
</nav>
        <table>
            <tr>
                <td>Name</td>
                <td>Email</td>
                <td>Age</td>
                <!-- <td>Conformation</td> -->
                <td>Approve</td>
            </tr>
            {% for i in a %}
            <tr>
                <td>{{i.name}}</td>
                <td>{{i.email}}</td>
                <td>{{i.age}}</td>
                <!-- <td>{{i.appr}}</td> -->
                <td>
                    <form method="POST" action="/store/apr/{{i.id}}" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" style="border: 0; background: none; padding: 0; color: inherit; cursor: pointer; font: inherit;">Approve</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
      {% load store_ui %}{% store_account_panels %}
</body>
</html>
