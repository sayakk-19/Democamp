{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Store</title>
    {% include 'store/includes/theme_head.html' %}
</head>
    <body>
<nav class="store-page-toolbar" aria-label="Account and home" hidden>
  <a class="store-home-link" href="{% url 'store_home' %}">Home</a>
  {% load store_ui %}{% store_account_menu %}
</nav>
        <form method="POST" action="/store/update/{{a.id}}">
            {% csrf_token %}
            <label for="a1">Name</label>
            <input type="text" name="a1" value="{{a.name}}">
            <label for="a2">Email Address</label>
            <input type="email" name="a2" value="{{a.email}}">
            <label for="a3">Phone Number</label>
            <input type="number" name="a3" value="{{a.phno}}">
            <label for="a4">Password</label>
            <input type="password" name="a4" value="{{a.pwd}}">
            <label for="a5">Age</label>
            <input type="number" name="a5" value="{{a.age}}">
            <label for="a6">Position</label>
            <input type="text" name="a6" value="{{a.position}}">
            <input type="submit">
        </form>
      {% load store_ui %}{% store_account_panels %}
</body>
</html>
