{% if store_account %}
<button type="button" class="store-profile-trigger{% if store_button_effects %} store-button-effects{% endif %}" data-store-open="store-profile-dialog" aria-label="Open your profile" aria-haspopup="dialog">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
</button>
{% elif show_login %}
<a class="store-account-signup{% if store_button_effects %} store-button-effects{% endif %}" href="{% url 'store_login' %}">Log in</a>
{% elif not hide_signup %}
<a class="store-account-signup{% if store_button_effects %} store-button-effects{% endif %}" href="{% url 'store_signup' %}">Sign up</a>
{% endif %}
