{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'shop/css/basic-theme.css' %}">

    <title>{% block title%} {% endblock %}</title>
     <style>{% block css %} {% endblock %}</style>
  </head>
  <body>

    <nav class="mac-navbar">

    <div class="mac-nav-container">

        <!-- Logo -->
        <a href="{% url 'ShopHome' %}" class="mac-logo">
            <span class="logo-icon">M</span>
            <span>
                My Awesome
                <small>Cart</small>
            </span>
        </a>

        <!-- Search -->
        <form class="mac-search" action="{% url 'Search' %}" method="get">
            <input
                type="text"
                name="search"
                placeholder="Search for products, brands and more"
            >
            <button type="submit">
                🔍
            </button>
        </form>

        <!-- Navigation -->
        <div class="mac-nav-actions">

            <a href="{% url 'ShopHome' %}" class="mac-nav-item">
                🏠 <span>Home</span>
            </a>

            <a href="{% url 'AboutUs' %}" class="mac-nav-item">
                About
            </a>

            <a href="{% url 'TrackingStatus' %}" class="mac-nav-item">
                📦 Tracker
            </a>

            <a href="/blog/" class="mac-nav-item">
                📝 Blog
            </a>

            <!-- More dropdown -->
            <div class="mac-dropdown">

                <button class="mac-nav-item mac-more-btn">
                    More ▾
                </button>

                <div class="mac-dropdown-menu">

                    <div class="dropdown-title">
                        More
                    </div>

                    <a href="/seller">
                        🏪 Become a Seller
                    </a>

                    <a href="#">
                        🔔 Notification Settings
                    </a>

                    <a href="#">
                        🎧 Customer Support
                    </a>

                    <a href="#">
                        📢 Advertise Products
                    </a>

                </div>

            </div>

            <!-- Cart -->
            <button
                type="button"
                id="popcart"
                class="/*mac-cart*/ btn btn-secondary mx-2"
                data-container="body"
                data-toggle="popover"
                data-placement="bottom"
                data-html="true"
            >
                🛒 Cart(<span id="cart">0</span>)
            </button>

        </div>

    </div>

</nav>
  {% block body %} {% endblock %}

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.js"
  integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="
  crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js" integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous"></script>
    {% block js %} {% endblock %}
  </body>
</html>
