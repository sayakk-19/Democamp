<!-- {% load static %} -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body, html{
            width: 100%;
            height: 100%;
        }
        .blur{
            filter: blur(5px);
        }
        .top-center{
            top: 38px;
        }
        .end-center{
            right: 34px;
        }
        .color-white{
            filter: invert();
        }
        .c-pointer{
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="vh-100 vw-100 form-check d-flex flex-column justify-content-center align-items-center position-relative">
        <form style="width: 20%;" class="form-control form-check d-flex flex-column justify-content-center align-items-center position-relative bg-primary-subtle rounded p-3" action="/shop/paytm">
            <div class="border-bottom border-dark">Choose your payment method</div>
            <div class="form-check position-relative d-flex flex-row justify-content-around w-100 pt-5 pb-3">
                <input type="radio" class="form-check-input position-relative" name="radioDefault" id="radioDefault1" style="top: 40%;">
                <label for="radioDefault1" class="form-check-label position-relative">
                    <img height="100px" src="../../static/shop/images/qr.jpeg" class="blur" alt="">
                    <img height="30px" src="../../static/shop/images/image.png" class="position-absolute top-center end-center color-white c-pointer" id="image" alt="">
                </label>
            </div>
            <div class="form-check position-relative d-flex flex-row justify-content-center pt-3 pb-5" style="gap: 137px;">
                <input type="radio" class="form-check-input position-relative" name="radioDefault" id="radioDefault2">
                <label for="radioDefault2" class="form-check-label">Paytm</label>
            </div>
            <div><button type="submit" class="btn btn-primary m-auto">Proceed</button></div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
